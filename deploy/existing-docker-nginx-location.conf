# Paste INSIDE the existing Nginx server { ... } in the PROXY CONTAINER.
# First join the app to the proxy's shared Docker network:
# PROXY_DOCKER_NETWORK=<existing-network-name> docker compose \
#  -f compose.yaml -f deploy/compose.proxy-network.yaml up -d --build

location = /meat-price {
    return 301 /meat-price/;
}

location ^~ /meat-price/ {
    # Docker DNS resolves the Compose service name on the shared network.
    proxy_pass http://meat-price:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
