# Paste INSIDE the existing Nginx server { ... } that handles your IP/domain.
# DO NOT paste another server { } or listen 80 directive.
# This example assumes Nginx runs on the Ubuntu HOST, not in Docker.

location = /meat-price {
    return 301 /meat-price/;
}

location ^~ /meat-price/ {
    # NOTE: deliberately no trailing slash; preserve /meat-price/ upstream.
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
