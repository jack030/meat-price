server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /meat-price {
        return 301 /meat-price/;
    }

    location ^~ /meat-price/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /meat-price/ {
        try_files $uri $uri/ /meat-price/index.html;
    }

    location / {
        return 404;
    }
}
